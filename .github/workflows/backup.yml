name: Backup diário do banco
# pg_dump da produção todo dia às 04:00 (Brasília). O arquivo fica como
# artefato do GitHub por 30 dias. Requer o segredo DATABASE_URL_PRODUCTION.
on:
  schedule: [{ cron: "0 7 * * *" }]
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: pg_dump
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL_PRODUCTION }}" }
        run: |
          FILE="contaojogo-$(date -u +%Y-%m-%d).dump"
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --format=custom --no-owner --file "$FILE"
          ls -lh "$FILE"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
      - name: Testar restauração (lista o conteúdo do dump)
        run: /usr/lib/postgresql/17/bin/pg_restore --list "$FILE" | grep -c "TABLE DATA"
      - uses: actions/upload-artifact@v4
        with: { name: "${{ env.FILE }}", path: "${{ env.FILE }}", retention-days: 30 }
