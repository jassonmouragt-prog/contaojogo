name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck || (npx next typegen && npm run typecheck)
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          BETTER_AUTH_SECRET: ci-placeholder-secret-with-32-characters!!
          BETTER_AUTH_URL: http://localhost:3000
